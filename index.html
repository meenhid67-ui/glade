<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glade</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1B2A4A">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#FAF7EF;
  --ink:#28374A;
  --ink-soft:#7C7A6C;
  --amber:#7A7657;
  --coral:#8B4C3D;
  --line:#E7DFCB;
  --white:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--white);position:relative;}

header{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--line);
}
header .greeting{font-size:20px;font-weight:700;}
header .cute-msg{font-size:13px;color:var(--ink-soft);margin-top:4px;}
header .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:6px;}

main{flex:1;padding:16px 20px 100px;overflow-y:auto;}

.card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
  background:var(--white);
  box-shadow:0 1px 3px rgba(40,55,74,0.05), 0 1px 2px rgba(40,55,74,0.04);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.card[onclick]:active{
  transform:scale(0.98);
  box-shadow:0 1px 2px rgba(40,55,74,0.06);
}
.tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-soft);
}
.big{font-size:26px;font-weight:700;margin-top:6px;}

.pill{
  display:inline-block;font-family:'IBM Plex Mono',monospace;
  font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;
}
.pill.coral{background:var(--coral);color:white;}
.pill.amber{background:var(--amber);color:var(--ink);}

.checkitem{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;}
.box{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:4px;flex:0 0 auto;}
.box.done{background:var(--ink);}

.bottom-nav{
  position:sticky;bottom:0;
  display:flex;justify-content:space-around;
  border-top:1px solid var(--line);
  background:var(--white);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:none;border:none;font-family:'Inter',sans-serif;
  font-size:10px;color:var(--ink-soft);display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;padding:4px 8px;
}
.nav-btn .ic{font-size:18px;display:flex;color:var(--ink-soft);transition:color 0.2s ease;}
.nav-btn.active{color:var(--ink);font-weight:700;}
.nav-btn.active .ic{color:var(--ink);}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.calgrid .dow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);padding-bottom:4px;}
.calgrid .day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent;
}
.calgrid .day.exam{background:var(--coral);color:white;font-weight:700;}
.calgrid .day.today{border-color:var(--ink);font-weight:700;}
.calgrid .day.empty{cursor:default;}
.calgrid .day.has-note::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--amber);margin-top:2px;}

.placeholder{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.8;
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(27,42,74,0.4);
  display:flex;align-items:flex-end;justify-content:center;z-index:10;
}
.modal{
  background:var(--white);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:20px;
}
.modal input, .modal textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
  font-family:'Inter',sans-serif;font-size:14px;margin-top:6px;
}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn{
  flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;
  font-size:13px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform 0.12s ease;
}
.btn:active{transform:scale(0.96);}
.btn::after{
  content:'';
  position:absolute;top:0;left:-75%;width:50%;height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
  transform:skewX(-20deg);
  transition:left 0.5s ease;
  pointer-events:none;
}
.btn:active::after{left:125%;}
.btn.primary{background:var(--ink);color:white;}
.btn.ghost{background:var(--paper);color:var(--ink);}
.btn.danger{background:var(--coral);color:white;}

.loading{text-align:center;padding:60px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;}

.chatbubble{border-radius:14px;padding:9px 13px;font-size:13px;max-width:82%;line-height:1.4;}
.chatbubble.bot{background:#EEF1F8;align-self:flex-start;}
.chatbubble.user{background:var(--ink);color:white;align-self:flex-end;}

@keyframes fadeInUp{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes flutter{
  0%{transform:translateX(-36px) translateY(0);}
  25%{transform:translateX(-8px) translateY(-8px);}
  50%{transform:translateX(36px) translateY(0);}
  75%{transform:translateX(-8px) translateY(-8px);}
  100%{transform:translateX(-36px) translateY(0);}
}
</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;background:#28374A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.4s ease;">
  <img src="icon-192.png" width="72" height="72" style="border-radius:18px;">
  <div style="color:white;font-family:'IBM Plex Mono',monospace;font-size:15px;margin-top:14px;letter-spacing:2px;">GLADE</div>
</div>
<div id="app">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="greeting">Hi 👋</div>
      <button onclick="openTutorial(false)" style="background:none;border:1px solid var(--line);color:var(--ink-soft);width:26px;height:26px;border-radius:50%;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;flex:0 0 auto;">?</button>
    </div>
    <div class="cute-msg">Small steps today, big wins on results day 🌱</div>
    <div class="sub" id="header-sub">loading...</div>
  </header>
  <main id="content"><div class="loading">Loading your data…</div></main>
  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="home"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>Home</button>
    <button class="nav-btn" data-tab="calendar"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Calendar</button>
    <button class="nav-btn" data-tab="todo"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l2.5 2.5L16 9"/></svg></span>To-Do</button>
    <button class="nav-btn" data-tab="tracker"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg></span>Tracker</button>
    <button class="nav-btn" data-tab="chat"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/></svg></span>AI</button>
  </nav>
</div>

<script>
let state = { todos: [], examDates: {}, notes: {}, hoursLog: {}, chatLog: [], tutorialSeen: false, subjectDayHours: {}, studyAdvice: null };
let currentTab = 'home';
let stateLoaded = false;

async function loadState(){
  try{
    const result = await window.storage.get('planner-state', false);
    if(result && result.value){
      state = JSON.parse(result.value);
    }
  }catch(e){
    console.log('No saved state yet, starting fresh.');
  }
  stateLoaded = true;
}

async function saveState(){
  try{
    await window.storage.set('planner-state', JSON.stringify(state), false);
  }catch(e){
    console.error('Save failed', e);
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function fmtDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function daysUntil(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const t = new Date(todayStr()+'T00:00:00');
  return Math.round((d - t) / 86400000);
}

function nextExam(){
  const today = todayStr();
  const upcoming = Object.keys(state.examDates)
    .filter(d => state.examDates[d] && d >= today)
    .sort();
  return upcoming[0] || null;
}

function hoursToday(){
  return state.hoursLog[todayStr()] || 0;
}

let greetingText = '';
function pickGreeting(){
  const name = state.username || 'there';
  const hour = new Date().getHours();
  if(hour < 12){
    greetingText = `Good morning, ${name}! ☀️`;
    return;
  }
  const options = [
    `Hey ${name}, ready to study?`,
    `How's it going, ${name}?`,
    `Good luck with today's session, ${name} 💪`,
    `What's up, ${name}?`
  ];
  greetingText = options[Math.floor(Math.random()*options.length)];
}

function renderHeader(){
  const n = nextExam();
  document.querySelector('.greeting').textContent = greetingText;
  document.getElementById('header-sub').textContent = n
    ? `${daysUntil(n)} day${daysUntil(n)===1?'':'s'} to ${fmtDateLabel(n)} exam`
    : 'No exam dates set yet';
}

function last7DaysSubjectSummary(){
  const totals = {};
  for(let i=0;i<7;i++){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dayData = (state.subjectDayHours && state.subjectDayHours[dateStr]) || {};
    Object.keys(dayData).forEach(subj => {
      totals[subj] = Math.round(((totals[subj]||0) + dayData[subj])*100)/100;
    });
  }
  return totals;
}

async function getStudyAdvice(){
  const btn = document.getElementById('advice-btn');
  if(btn){ btn.textContent = 'Thinking…'; btn.disabled = true; }

  const totals = last7DaysSubjectSummary();
  const subjectList = Object.keys(totals);
  const upcomingExam = nextExam();

  if(subjectList.length === 0){
    state.studyAdvice = "Log a few study sessions in the Tracker first — then I can tell you which subjects need more attention.";
    await saveState();
    render();
    return;
  }

  const summaryText = subjectList.map(s => `${s}: ${totals[s]}h`).join(', ');
  const examText = upcomingExam ? `Next exam is ${fmtDateLabel(upcomingExam)} (${daysUntil(upcomingExam)} days away).` : 'No exam date set yet.';
  const systemText = `You are an AI study advisor for a Matric student. Here is their study time over the last 7 days, per subject: ${summaryText}. ${examText} Give ONE short, specific, actionable insight (max 2 sentences) — point out an imbalance or a subject that's been neglected relative to the others, and suggest what to focus on next. Be direct and concrete, not generic. Reply with ONLY a JSON object, no markdown, in this exact shape: {"advice": "<your insight>"}.`;

  try{
    const result = await callGemini(systemText, "Give me advice.", null);
    state.studyAdvice = result.advice || "Keep logging sessions so I can spot patterns.";
  }catch(e){
    console.error('Study advice failed', e);
    const sorted = subjectList.slice().sort((a,b)=>totals[a]-totals[b]);
    state.studyAdvice = `⚠️ AI unavailable right now — but based on your logged hours, ${sorted[0]} has had the least time (${totals[sorted[0]]}h this week). Might be worth prioritizing.`;
  }
  await saveState();
  render();
}

function renderHome(){
  const todos = state.todos.filter(t => t.date === todayStr());
  const doneCount = todos.filter(t=>t.done).length;
  return `
    <div class="card">
      <div class="tag">Today's study hours</div>
      <div class="big">${hoursToday()}h</div>
    </div>
    <div class="card" onclick="goToTab('todo')" style="cursor:pointer;">
      <div class="tag">Today's to-dos (${doneCount}/${todos.length})</div>
      ${todos.length === 0
        ? '<div style="font-size:13px;color:var(--ink-soft);margin-top:6px;">Nothing added for today yet — tap to add some.</div>'
        : todos.slice(0,4).map(t => `
          <div class="checkitem">
            <div class="box ${t.done?'done':''}"></div>
            <span style="${t.done?'text-decoration:line-through;color:var(--ink-soft);':''}">${escapeHtml(t.text)}</span>
          </div>`).join('')
      }
      ${todos.length > 4 ? '<div style="text-align:center;color:var(--ink-soft);letter-spacing:3px;margin-top:6px;">•••</div>' : ''}
    </div>
    <div class="card" onclick="goToTab('calendar')" style="cursor:pointer;">
      <div class="tag">Next exam</div>
      <div style="margin-top:6px;font-size:14px;">
        ${nextExam() ? fmtDateLabel(nextExam()) + ' — ' + (daysUntil(nextExam())) + ' days away' : 'None set — tap to mark one'}
      </div>
    </div>
    <div class="card">
      <div class="tag">🧠 AI Study Advice</div>
      <div id="study-advice-text" style="font-size:13px;margin-top:6px;color:${state.studyAdvice?'var(--ink)':'var(--ink-soft)'};">
        ${state.studyAdvice || 'Get a quick read on which subjects need more attention.'}
      </div>
      <button id="advice-btn" class="btn ghost" style="width:100%;margin-top:10px;" onclick="getStudyAdvice()">${state.studyAdvice ? 'Refresh advice' : 'Get advice'}</button>
    </div>
  `;
}

function renderCalendar(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isExam = !!state.examDates[dateStr];
    const isToday = dateStr === todayStr();
    const hasNote = !!state.notes[dateStr];
    cells += `<div class="day ${isExam?'exam':''} ${isToday?'today':''} ${hasNote?'has-note':''}" onclick="openDayModal('${dateStr}')">${d}</div>`;
  }

  return `
    <div class="card">
      <div class="tag" style="margin-bottom:10px;">${monthName}</div>
      <div class="calgrid">
        <div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>
        ${cells}
      </div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:center;">Tap a date to mark an exam or add a note</div>
    <div id="day-modal-slot"></div>
  `;
}

function openDayModal(dateStr){
  const note = state.notes[dateStr] || '';
  const isExam = !!state.examDates[dateStr];
  const slot = document.getElementById('day-modal-slot');
  slot.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeDayModal()">
      <div class="modal">
        <div class="tag">${fmtDateLabel(dateStr)}</div>
        <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;">
          <input type="checkbox" id="exam-toggle" ${isExam?'checked':''} style="width:auto;">
          Mark as exam day
        </label>
        <textarea id="note-input" rows="3" placeholder="Note for this day...">${escapeHtml(note)}</textarea>
        <div class="modal-actions">
          <button class="btn ghost" onclick="closeDayModal()">Cancel</button>
          <button class="btn primary" onclick="saveDayModal('${dateStr}')">Save</button>
        </div>
      </div>
    </div>
  `;
}
function closeDayModal(){
  document.getElementById('day-modal-slot').innerHTML = '';
}
async function saveDayModal(dateStr){
  const isExam = document.getElementById('exam-toggle').checked;
  const note = document.getElementById('note-input').value.trim();
  if(isExam) state.examDates[dateStr] = true; else delete state.examDates[dateStr];
  if(note) state.notes[dateStr] = note; else delete state.notes[dateStr];
  await saveState();
  closeDayModal();
  render();
}

function renderTodo(){
  const todos = state.todos.filter(t => t.date === todayStr());
  const total = todos.length;
  const doneCount = todos.filter(t=>t.done).length;
  const pct = total === 0 ? 0 : Math.round((doneCount/total)*100);

  let momentumMsg = 'Add your first task for today';
  if(total > 0){
    if(pct === 0) momentumMsg = "Let's begin 💪";
    else if(pct < 50) momentumMsg = 'Good start, keep going';
    else if(pct < 100) momentumMsg = 'Halfway there!';
    else momentumMsg = 'All done for today! 🎉';
  }

  const groups = {};
  todos.forEach(t=>{
    const subj = t.subject || 'General';
    if(!groups[subj]) groups[subj] = [];
    groups[subj].push(t);
  });

  const groupsHtml = Object.keys(groups).map(subj => `
    <div class="card">
      <div class="tag">${escapeHtml(subj)}</div>
      ${groups[subj].map(t => `
        <div class="checkitem" onclick="toggleTodo('${t.id}')" style="cursor:pointer;">
          <div class="box ${t.done?'done':''}"></div>
          <span style="flex:1;${t.done?'text-decoration:line-through;color:var(--ink-soft);':''}">${escapeHtml(t.text)}</span>
          <span onclick="event.stopPropagation(); deleteTodo('${t.id}')" style="color:var(--ink-soft);font-size:16px;padding:0 4px;">×</span>
        </div>`).join('')}
    </div>
  `).join('');

  return `
    <div class="card">
      <div class="tag">Today's progress</div>
      <div style="background:var(--line);border-radius:20px;height:10px;margin-top:8px;overflow:hidden;">
        <div style="background:var(--amber);height:100%;width:${pct}%;transition:width 0.3s;"></div>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">${momentumMsg}</div>
    </div>
    ${total === 0 ? '' : groupsHtml}
    <div class="card">
      <div class="tag">Add a task</div>
      <input id="new-task-subject" placeholder="Subject (e.g. Physics)" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:8px;font-family:'Inter',sans-serif;font-size:13px;">
      <input id="new-task-text" placeholder="Task" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:8px;font-family:'Inter',sans-serif;font-size:13px;">
      <button class="btn primary" style="width:100%;margin-top:10px;" onclick="addTodo()">Add task</button>
    </div>
  `;
}

async function toggleTodo(id){
  const t = state.todos.find(t=>t.id===id);
  if(t){ t.done = !t.done; await saveState(); render(); }
}

async function deleteTodo(id){
  state.todos = state.todos.filter(t=>t.id!==id);
  await saveState();
  render();
}

async function addTodo(){
  const subjInput = document.getElementById('new-task-subject');
  const textInput = document.getElementById('new-task-text');
  const subject = subjInput.value.trim() || 'General';
  const text = textInput.value.trim();
  if(!text) return;
  state.todos.push({ id: 'todo_'+Date.now()+'_'+Math.floor(Math.random()*1000), text, subject, date: todayStr(), done: false });
  await saveState();
  render();
}

let timerRunning = false;
let timerSubject = '';
let timerStartMs = null;
let timerIntervalId = null;
let aiEditEnabled = false;

function toggleAiEdit(){
  aiEditEnabled = !aiEditEnabled;
  render();
}

function renderTracker(){
  const weekData = getLast7DaysHours();
  const maxHour = Math.max(1, ...weekData.map(d=>d.hours));
  const forest = state.forestTrees || [];

  return `
    <div class="card">
      <div class="tag">🌱 Start a focus session</div>
      <div style="font-size:12px;color:var(--ink-soft);margin:6px 0 10px;">Tap Start to go full-screen and watch your tree grow while you study.</div>
      <input id="tracker-subject" placeholder="Subject (e.g. Physics)" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;">
      <button class="btn primary" style="width:100%;margin-top:10px;" onclick="startTimer()">Start</button>
    </div>
    <div class="card">
      <div class="tag">This week</div>
      <div style="display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:12px;">
        ${weekData.map(d => `
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
            <div style="width:100%;border-radius:4px 4px 0 0;background:${d.isToday?'var(--coral)':'var(--ink-soft)'};height:${Math.max(4,(d.hours/maxHour)*70)}px;"></div>
            <div style="font-size:9px;color:var(--ink-soft);margin-top:4px;font-family:'IBM Plex Mono',monospace;">${d.label}</div>

function pixelGrid(matrix, size){
  const cols = matrix[0].length;
  let html = `<div style="display:grid;grid-template-columns:repeat(${cols}, ${size}px);grid-auto-rows:${size}px;">`;
  matrix.forEach(row=>{
    row.forEach(color=>{
      html += `<div style="background:${color||'transparent'};width:${size}px;height:${size}px;"></div>`;
    });
  });
  html += `</div>`;
  return html;
}

function renderTreeSprite(stage, size){
  return pixelGrid(treeStages[Math.min(Math.max(stage,0), treeStages.length-1)], size||8);
}

function renderGrassStrip(units, size){
  let html = '<div style="display:flex;">';
  for(let i=0;i<units;i++){
    html += pixelGrid(i%3===0 ? grassUnitB : grassUnitA, size);
  }
  html += '</div>';
  return html;
}

function renderGrassStripFancy(units, size){
  let html = '<div style="display:flex;">';
  for(let i=0;i<units;i++){
    let unit = i%7===3 ? flowerUnit : (i%3===0 ? grassUnitB : grassUnitA);
    html += pixelGrid(unit, size);
  }
  html += '</div>';
  return html;
}

function growthStage(elapsedMs){
  const min = elapsedMs/60000;
  if(min < 5) return 0;
  if(min < 20) return 1;
  if(min < 40) return 2;
  return 3;
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

    console.log('Wake lock unavailable', e);
  }

  const input = document.getElementById('tracker-subject');

    const elapsed = Date.now()-timerStartMs;
    const timerEl = document.getElementById('focus-timer');
    const treeEl = document.getElementById('focus-tree');

async function stopTimer(){
  clearInterval(timerIntervalId);
  const elapsedMs = Date.now()-timerStartMs;
  const hours = elapsedMs/3600000;
  const dateStr = todayStr();
  state.hoursLog[dateStr] = Math.round(((state.hoursLog[dateStr]||0)+hours)*100)/100;
  if(!state.subjectDayHours) state.subjectDayHours = {};
  if(!state.subjectDayHours[dateStr]) state.subjectDayHours[dateStr] = {};
  state.subjectDayHours[dateStr][timerSubject] = Math.round(((state.subjectDayHours[dateStr][timerSubject]||0)+hours)*100)/100;
  if(!state.forestTrees) state.forestTrees = [];
  state.forestTrees.push({ date: dateStr, subject: timerSubject, stage: growthStage(elapsedMs) });
  timerRunning = false;
  timerSubject = '';
  timerStartMs = null;
  releaseWakeLock();
  await saveState();
  render();
}

function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function buildPlanSummary(){
  const todos = state.todos.filter(t=>t.date===todayStr() && !t.done);
  if(todos.length === 0) return "You're all caught up for today! 🎉 Tell me if anything changes and I'll adjust your plan.";
  const list = todos.map(t=>`${t.subject}: ${t.text}`).join(', ');
  return `Here's today's plan: ${list}. Let me know if something comes up and I'll adjust it.`;
}

function moveTodosToTomorrow(){
  const today = todayStr();
  const tomorrow = addDays(today, 1);
  const pending = state.todos.filter(t => t.date === today && !t.done);
  pending.forEach(t => { t.date = tomorrow; });
  return pending;
}

function rescheduleToday(){
  const pending = moveTodosToTomorrow();
  if(pending.length === 0){
    return "Looks like everything for today's already done — nothing to move!";
  }
  const list = pending.map(t=>t.text).join(', ');
  return `No worries — I moved ${pending.length} task${pending.length===1?'':'s'} (${list}) to tomorrow. You're still on track.`;
}

function generateReply(text){
  const t = text.toLowerCase();
  if(/(didn.?t study|no time|couldn.?t study|missed|too busy|busy today|out of time)/.test(t)){
    return rescheduleToday();
  }
  if(/(plan|today|schedule)/.test(t)){
    return buildPlanSummary();
  }
  if(/(tired|don.?t want|unmotivated|give up|can.?t do this|exhausted)/.test(t)){
    return "That's okay — even a short 15-minute push counts. Want me to trim today's plan down to just the essentials?";
  }
  return "Got it 👍 Let me know if you want me to move anything around in your plan.";
}

  const response = await fetch(AI_WORKER_URL, {

      model,
      systemText,
      userText: userText || "Here's an image.",

    })
  });
  const data = await response.json();
  const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!raw) throw new Error(data?.error?.message || 'No response from AI');

}

async function callGemini(systemText, userText, imagePart){
  let lastError = null;
  for(const model of GEMINI_MODEL_CHAIN){
    for(let attempt = 1; attempt <= 2; attempt++){
      try{
        return await callGeminiOnce(model, systemText, userText, imagePart);
      }catch(e){
        lastError = e;
        const msg = (e && e.message) ? e.message.toLowerCase() : '';
        const isOverloaded = msg.includes('overload') || msg.includes('high demand') || msg.includes('unavailable') || msg.includes('503') || msg.includes('not found') || msg.includes('no longer available');
        if(isOverloaded && attempt < 2){
          await new Promise(r => setTimeout(r, 800));
          continue;
        }
        break; // move to next model in the chain
      }
    }
  }
  throw lastError || new Error('All AI models unavailable');
}

      <button id="tt-generate-btn" class="btn primary" style="width:100%;margin-top:12px;" onclick="submitTimetableForm()">Generate my timetable</button>
    </div>` : ''}
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div class="tag">Let AI edit my schedule</div>
        <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">Off by default — turn on only when you want changes applied</div>
      </div>
      <label style="position:relative;display:inline-block;width:40px;height:22px;flex:0 0 auto;">
        <input type="checkbox" id="ai-edit-toggle" ${aiEditEnabled?'checked':''} onchange="toggleAiEdit()" style="opacity:0;width:0;height:0;">
        <span style="position:absolute;inset:0;background:${aiEditEnabled?'var(--ink)':'var(--line)'};border-radius:20px;transition:.2s;pointer-events:none;"></span>
        <span style="position:absolute;top:3px;left:${aiEditEnabled?'21px':'3px'};width:16px;height:16px;background:white;border-radius:50%;transition:.2s;pointer-events:none;"></span>
      </label>
    </div>
    <div style="margin-bottom:10px;">${tonePills}</div>
    <div style="display:flex;flex-direction:column;gap:8px;min-height:40vh;">
      ${bubbles}
    </div>
    ${pendingChatImage ? `
      <div style="display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:8px;font-size:11px;color:var(--ink-soft);">
        📎 ${escapeHtml(pendingChatImage.name)} <span onclick="clearPendingImage()" style="margin-left:auto;cursor:pointer;">✕</span>
      </div>` : ''}
    <div style="position:sticky;bottom:0;display:flex;gap:8px;background:var(--white);padding-top:10px;align-items:center;">
      <label style="cursor:pointer;flex:0 0 auto;font-size:18px;color:var(--ink-soft);">
        📷<input type="file" accept="image/*" style="display:none;" onchange="handleImagePick(this)">
      </label>
      <input id="chat-input" placeholder="Tell me what's going on..." onkeydown="if(event.key==='Enter') sendChat()" style="flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:20px;font-family:'Inter',sans-serif;font-size:13px;">
      <button class="btn primary" style="flex:0 0 auto;padding:10px 18px;border-radius:20px;" onclick="sendChat()">Send</button>
    </div>
  `;
}

async function sendChat(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text && !pendingChatImage) return;
  input.value = '';
  const imageToSend = pendingChatImage;
  pendingChatImage = null;
  state.chatLog.push({
    role:'user',
    text: text || '(sent an image)',
    image: imageToSend ? { base64: imageToSend.base64, mimeType: imageToSend.mimeType } : null
  });
  state.chatLog.push({role:'bot', text:'…', thinking:true});
  render();
  scrollChatBottom();

  const pendingTodos = state.todos.filter(t=>t.date===todayStr() && !t.done);
  let result;
  let debugMsg = null;
  try{
    if(AI_WORKER_URL.startsWith('PASTE_')) throw new Error('AI Worker not set up yet');
    result = await callAI(text, pendingTodos, imageToSend);
  }catch(e){
    console.error('AI call failed, using offline fallback', e);
    debugMsg = (e && e.message) ? e.message : String(e);
    const fallbackReply = imageToSend
      ? "I couldn't reach the AI to look at that image just now (connection issue) — give it a moment and try sending it again."
      : generateReply(text);
    result = { reply: fallbackReply, reschedule: false };
  }

  state.chatLog = state.chatLog.filter(m => !m.thinking);
  if(debugMsg){
    state.chatLog.push({role:'bot', text: '⚠️ debug: '+debugMsg});
  }
  if(result.reschedule){
    if(aiEditEnabled){
      moveTodosToTomorrow();
    } else {
      result.reply += ' (Flip the toggle above if you want me to actually move things — right now I only chatted, nothing changed.)';
    }
  }
  state.chatLog.push({role:'bot', text: result.reply});
  await saveState();
  render();
  scrollChatBottom();
}

function renderPlaceholder(label){
  return `<div class="placeholder">🔧<br>${label}<br>— building this next —</div>`;
}


function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function render(){
  if(timerRunning){
    document.querySelector('header').style.display = 'none';
    document.querySelector('.bottom-nav').style.display = 'none';
    renderFocusMode();
    return;
  }
  document.querySelector('header').style.display = '';
  document.querySelector('.bottom-nav').style.display = '';
  renderHeader();
  const content = document.getElementById('content');
  if(currentTab === 'home') content.innerHTML = renderHome();
  else if(currentTab === 'calendar') content.innerHTML = renderCalendar();
  else if(currentTab === 'todo') content.innerHTML = renderTodo();
  else if(currentTab === 'tracker') content.innerHTML = renderTracker();
  else if(currentTab === 'chat') content.innerHTML = renderChat();
  content.style.animation = 'none';
  void content.offsetHeight;
  content.style.animation = 'fadeInUp 0.28s ease';

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab === currentTab);
  });
}

function goToTab(tab){
  currentTab = tab;
  render();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.dataset.tab;
    render();
  });
});

function showOnboarding(){
  document.querySelector('header').style.display = 'none';
  document.querySelector('.bottom-nav').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div style="min-height:65vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
      <div style="font-size:22px;font-weight:700;margin-bottom:8px;">Welcome 👋</div>
      <div class="tag" style="margin-bottom:18px;">What should we call you?</div>
      <input id="username-input" placeholder="Your name" style="width:80%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;font-family:'Inter',sans-serif;">
      <button class="btn primary" style="margin-top:16px;width:80%;flex:none;" onclick="submitUsername()">Let's go</button>
    </div>
  `;
  document.getElementById('username-input').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') submitUsername();
  });
}

const tutorialSlides = [
  { icon:'🏠', title:'Home', text:'A quick glance at your day — today\'s study hours, a preview of your to-dos, and your next exam countdown.' },
  { icon:'📅', title:'Calendar', text:'Tap any date to mark it as an exam or add a note. Exam days show up in terracotta so they stand out.' },
  { icon:'✅', title:'To-Do', text:'Add tasks grouped by subject. Check them off and watch the progress bar fill up as you go.' },
  { icon:'🌳', title:'Tracker', text:'Start a focus session and the screen goes quiet — just you and a little tree that grows as you study. Every finished session joins your forest.' },
  { icon:'💬', title:'AI Planner', text:'Chat about your day — ask for your plan, or tell it if you missed studying. Flip the toggle on if you want it to actually adjust your schedule.' },
];
let tutorialIndex = 0;

function openTutorial(isFirstTime){
  document.querySelector('.bottom-nav').style.display = 'none';
  renderTutorialSlide(isFirstTime);
}

function renderTutorialSlide(isFirstTime){
  const s = tutorialSlides[tutorialIndex];
  const dots = tutorialSlides.map((_,i)=>`<span style="width:6px;height:6px;border-radius:50%;background:${i===tutorialIndex?'var(--ink)':'var(--line)'};display:inline-block;margin:0 3px;"></span>`).join('');
  document.getElementById('content').innerHTML = `
    <div style="min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:0 8px;">
      <div style="font-size:52px;">${s.icon}</div>
      <div style="font-size:19px;font-weight:700;">${s.title}</div>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:320px;">${s.text}</div>
      <div style="margin-top:6px;">${dots}</div>
    </div>
    <div style="display:flex;gap:10px;padding:0 4px;">
      ${tutorialIndex > 0 ? '<button class="btn ghost" onclick="prevTutorialSlide('+isFirstTime+')">Back</button>' : `<button class="btn ghost" onclick="finishTutorial(${isFirstTime})">Skip</button>`}
      ${tutorialIndex < tutorialSlides.length-1
        ? `<button class="btn primary" onclick="nextTutorialSlide(${isFirstTime})">Next</button>`
        : `<button class="btn primary" onclick="finishTutorial(${isFirstTime})">Get started</button>`}
    </div>
  `;
}

function nextTutorialSlide(isFirstTime){
  tutorialIndex = Math.min(tutorialIndex+1, tutorialSlides.length-1);
  renderTutorialSlide(isFirstTime);
}

function prevTutorialSlide(isFirstTime){
  tutorialIndex = Math.max(tutorialIndex-1, 0);
  renderTutorialSlide(isFirstTime);
}

async function finishTutorial(isFirstTime){
  tutorialIndex = 0;
  document.querySelector('.bottom-nav').style.display = '';
  if(isFirstTime){
    state.tutorialSeen = true;
    await saveState();
  }
  render();
}

async function submitUsername(){
  const val = document.getElementById('username-input').value.trim();
  if(!val) return;
  state.username = val;
  await saveState();
  document.querySelector('header').style.display = '';
  pickGreeting();
  if(!state.tutorialSeen){
    tutorialIndex = 0;
    openTutorial(true);
  } else {
    document.querySelector('.bottom-nav').style.display = '';
    render();
  }
}

function hideSplash(){
  const s = document.getElementById('splash');
  if(s){
    s.style.opacity = '0';
    setTimeout(()=>{ s.remove(); }, 400);
  }
}

async function init(){
  const [_] = await Promise.all([loadState(), new Promise(r=>setTimeout(r,600))]);
  if(!state.username){
    showOnboarding();
    hideSplash();
    return;
  }
  pickGreeting();
  render();
  hideSplash();
}
init();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
