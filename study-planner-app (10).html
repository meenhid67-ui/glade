<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glade</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1B2A4A">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap');

:root{
  --paper:#DAD6CD;
  --ink:#28374A;
  --ink-soft:#83837A;
  --amber:#6B8F6B;
  --coral:#A66A42;
  --priority-yellow:#BC9269;
  --priority-blue:#7D7D74;
  --line:#C9C4B8;
  --white:#FFFEFB;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--paper);font-family:'Nunito',sans-serif;color:var(--ink);}
body{
  background:linear-gradient(160deg, #C7C2B4 0%, var(--paper) 45%, #C3CBC3 100%);
  min-height:100vh;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--white);position:relative;}

@media (min-width:768px){
  body{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:40px 20px;
    gap:20px;
  }
  #app{
    min-height:auto;
    max-height:90vh;
    border-radius:32px;
    box-shadow:0 30px 70px rgba(74,55,40,0.22), 0 8px 24px rgba(74,55,40,0.12);
    overflow-y:auto;
    border:1px solid var(--line);
  }
  #splash{border-radius:0;}
  #desktop-sidebar{
    display:flex;
    flex-direction:column;
    width:200px;
    flex:0 0 auto;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:24px;
    padding:20px 0;
    box-shadow:0 30px 70px rgba(74,55,40,0.18), 0 8px 24px rgba(74,55,40,0.1);
    margin-top:0;
  }
  .desktop-sidebar-brand{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:16px;
    letter-spacing:2px;
    padding:0 24px 16px;
    margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .desktop-sidebar-divider{
    border-top:1px solid var(--line);
    margin:10px 24px;
  }
  .desktop-nav-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:none;
    border:none;
    text-align:left;
    padding:11px 24px;
    font-size:14px;
    font-family:'Nunito',sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .desktop-nav-btn:hover{background:var(--paper);}
  .desktop-nav-btn.active{color:var(--ink);font-weight:700;background:var(--paper);}
  .desktop-nav-btn .ic{display:flex;}
  .bottom-nav{display:none;}
}
#desktop-sidebar{display:none;}
@media (max-width:767px){
  #desktop-sidebar{display:none;}
}
@media (min-width:1024px){
  #app{max-width:520px;}
}

header{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--line);
}
header .greeting{font-size:20px;font-weight:700;}
header .cute-msg{font-size:13px;color:var(--ink-soft);margin-top:4px;}
header .sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-top:6px;}

main{flex:1;padding:16px 20px 100px;overflow-y:auto;}

.card{
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px;
  margin-bottom:14px;
  background:var(--white);
  box-shadow:0 1px 3px rgba(40,55,74,0.05), 0 1px 2px rgba(40,55,74,0.04);
  transition:transform 0.15s ease, box-shadow 0.15s ease;
  animation:fadeInUp 0.4s ease backwards;
}
#content .card:nth-of-type(1){animation-delay:0.02s;}
#content .card:nth-of-type(2){animation-delay:0.07s;}
#content .card:nth-of-type(3){animation-delay:0.12s;}
#content .card:nth-of-type(4){animation-delay:0.17s;}
#content .card:nth-of-type(5){animation-delay:0.22s;}
.card[onclick]:active{
  transform:scale(0.98);
  box-shadow:0 1px 2px rgba(40,55,74,0.06);
}
.tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-soft);
}
.big{font-size:26px;font-weight:700;margin-top:6px;}

.pill{
  display:inline-block;font-family:'IBM Plex Mono',monospace;
  font-size:10px;padding:3px 10px;border-radius:20px;font-weight:600;
}
.pill.coral{background:var(--coral);color:white;}
.pill.amber{background:var(--amber);color:var(--ink);}

.checkitem{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;}
.box{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:5px;flex:0 0 auto;transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1), background 0.2s ease;}
.box.done{animation:popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.box.done{background:var(--ink);}

.bottom-nav{
  position:sticky;bottom:0;
  display:flex;justify-content:space-around;
  border-top:1px solid var(--line);
  background:var(--white);
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
}
.nav-btn{
  background:none;border:none;font-family:'Nunito',sans-serif;
  font-size:10px;color:var(--ink-soft);display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;padding:4px 8px;
}
.nav-btn .ic{font-size:18px;display:flex;color:var(--ink-soft);transition:color 0.2s ease;}
.nav-btn.active{color:var(--ink);font-weight:700;}
.nav-btn.active .ic{color:var(--ink);}

.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.calgrid .dow{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);padding-bottom:4px;}
.calgrid .day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent;
}
.calgrid .day.exam{background:var(--coral);color:white;font-weight:700;}
.calgrid .day.today{border-color:var(--ink);font-weight:700;}
.calgrid .day.empty{cursor:default;}
.calgrid .day.has-note::after{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--amber);margin-top:2px;}
.priority-pill{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;}
.priority-pill.selected{border-color:var(--ink);}

.placeholder{
  text-align:center;padding:60px 20px;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.8;
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(27,42,74,0.4);
  display:flex;align-items:flex-end;justify-content:center;z-index:10;
}
.modal{
  background:var(--white);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  padding:20px;
}
.modal input, .modal textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;
  font-family:'Nunito',sans-serif;font-size:14px;margin-top:6px;
}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn{
  flex:1;padding:10px;border-radius:16px;border:none;font-weight:600;
  font-size:13px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform 0.12s ease;
}
.btn:active{transform:scale(0.96);}
.btn::after{
  content:'';
  position:absolute;top:0;left:-75%;width:50%;height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
  transform:skewX(-20deg);
  transition:left 0.5s ease;
  pointer-events:none;
}
.btn:active::after{left:125%;}
.btn.primary{background:var(--ink);color:white;}
.btn.ghost{background:var(--paper);color:var(--ink);}
.btn.danger{background:var(--coral);color:white;}

.loading{text-align:center;padding:60px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;}

.chatbubble{border-radius:18px;padding:9px 13px;font-size:13px;max-width:82%;line-height:1.4;}
.chatbubble.bot{background:#EEF1F8;align-self:flex-start;}
.chatbubble.user{background:var(--ink);color:white;align-self:flex-end;}

@keyframes splashPulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);}
}

@keyframes popIn{
  0%{transform:scale(0.6);opacity:0;}
  60%{transform:scale(1.1);opacity:1;}
  100%{transform:scale(1);}
}

@keyframes slideIn{
  from{transform:translateX(-100%);}
  to{transform:translateX(0);}
}

@keyframes fadeInUp{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}

@keyframes flutter{
  0%{transform:translateX(-36px) translateY(0);}
  25%{transform:translateX(-8px) translateY(-8px);}
  50%{transform:translateX(36px) translateY(0);}
  75%{transform:translateX(-8px) translateY(-8px);}
  100%{transform:translateX(-36px) translateY(0);}
}
</style>
</head>
<body>
<div id="splash" style="position:fixed;inset:0;background:#28374A;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity 0.6s ease, transform 0.6s ease;">
  <img src="icon-192.png" width="76" height="76" style="border-radius:20px;animation:splashPulse 1.8s ease-in-out infinite;">
  <div style="color:white;font-family:'IBM Plex Mono',monospace;font-size:15px;margin-top:16px;letter-spacing:3px;">GLADE</div>
</div>
<nav id="desktop-sidebar">
  <div class="desktop-sidebar-brand">Glade</div>
  <button class="nav-btn desktop-nav-btn" data-tab="home" onclick="goToTab('home')"><span class="ic"></span>Home</button>
  <button class="nav-btn desktop-nav-btn" data-tab="calendar" onclick="goToTab('calendar')"><span class="ic"></span>Calendar</button>
  <button class="nav-btn desktop-nav-btn" data-tab="todo" onclick="goToTab('todo')"><span class="ic"></span>To-Do</button>
  <button class="nav-btn desktop-nav-btn" data-tab="tracker" onclick="goToTab('tracker')"><span class="ic"></span>Tracker</button>
  <button class="nav-btn desktop-nav-btn" data-tab="chat" onclick="goToTab('chat')"><span class="ic"></span>AI Planner</button>
  <div class="desktop-sidebar-divider"></div>
  <button class="nav-btn desktop-nav-btn" data-tab="settings" onclick="goToTab('settings')"><span class="ic"></span>Settings</button>
</nav>
<div id="app">
  <header>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <button onclick="openSidebar()" style="background:none;border:none;color:var(--ink);cursor:pointer;padding:2px;flex:0 0 auto;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="greeting" style="flex:1;text-align:center;">Hi 👋</div>
      <button onclick="openTutorial(false)" style="background:none;border:1px solid var(--line);color:var(--ink-soft);width:26px;height:26px;border-radius:50%;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;flex:0 0 auto;">?</button>
    </div>
    <div class="sub" id="header-sub" style="text-align:center;">loading...</div>
  </header>
  <div id="sidebar-slot"></div>
  <main id="content"><div class="loading">Loading your data…</div></main>
  <nav class="bottom-nav">
    <button class="nav-btn" data-tab="home"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>Home</button>
    <button class="nav-btn" data-tab="calendar"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Calendar</button>
    <button class="nav-btn" data-tab="todo"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l2.5 2.5L16 9"/></svg></span>To-Do</button>
    <button class="nav-btn" data-tab="tracker"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg></span>Tracker</button>
    <button class="nav-btn" data-tab="chat"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/></svg></span>AI</button>
  </nav>
</div>

<script>
let state = { todos: [], examDates: {}, notes: {}, hoursLog: {}, chatLog: [], tutorialSeen: false, subjectDayHours: {}, studyAdvice: null, calendarEntries: {} };
let currentTab = 'home';
let stateLoaded = false;

async function loadState(){
  try{
    if(window.storage){
      const result = await window.storage.get('planner-state', false);
      if(result && result.value){
        state = JSON.parse(result.value);
        stateLoaded = true;
        return;
      }
    }
  }catch(e){
    // window.storage not available here — fall through to localStorage
  }
  try{
    const raw = localStorage.getItem('glade-planner-state');
    if(raw){
      state = JSON.parse(raw);
    }
  }catch(e){
    console.log('No saved state yet, starting fresh.');
  }
  stateLoaded = true;
}

async function saveState(){
  try{
    if(window.storage){
      await window.storage.set('planner-state', JSON.stringify(state), false);
    }
  }catch(e){
    // window.storage not available here — fall through to localStorage
  }
  try{
    localStorage.setItem('glade-planner-state', JSON.stringify(state));
  }catch(e){
    console.error('Save failed', e);
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function fmtDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function daysUntil(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const t = new Date(todayStr()+'T00:00:00');
  return Math.round((d - t) / 86400000);
}

function priorityColor(p){
  if(p==='red') return 'var(--coral)';
  if(p==='yellow') return 'var(--priority-yellow)';
  return 'var(--priority-blue)';
}

function getAllUpcomingEntries(){
  const today = todayStr();
  const results = [];
  const entries = state.calendarEntries || {};
  Object.keys(entries).filter(d=>d>=today).sort().forEach(d=>{
    (entries[d]||[]).forEach(e=>{ results.push({ date: d, ...e }); });
  });
  const priorityOrder = {red:0, yellow:1, blue:2};
  results.sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (priorityOrder[a.priority] ?? 3) - (priorityOrder[b.priority] ?? 3);
  });
  return results;
}

function nextExam(){
  const upcoming = getAllUpcomingEntries();
  return upcoming.length ? upcoming[0].date : null;
}

function nextEntryLabel(){
  const upcoming = getAllUpcomingEntries();
  if(!upcoming.length) return '';
  const e = upcoming[0];
  return `${e.type}${e.label ? ': '+e.label : ''}`;
}

function hoursToday(){
  return state.hoursLog[todayStr()] || 0;
}

let greetingText = '';
const motivationalQuotes = [
  "Small steps today, big wins on results day.",
  "You don't have to feel ready. Just start.",
  "Progress hides in ordinary days.",
  "Future you is counting on today's you.",
  "One page, one problem, one step at a time."
];
let cuteMsgText = motivationalQuotes[0];
function pickCuteMsg(){
  cuteMsgText = motivationalQuotes[Math.floor(Math.random()*motivationalQuotes.length)];
}

function pickGreeting(){
  const name = state.username || 'there';
  const hour = new Date().getHours();
  if(hour < 12){
    greetingText = `Good morning, ${name}! ☀️`;
    return;
  }
  const options = [
    `Hey ${name}, ready to study?`,
    `How's it going, ${name}?`,
    `Good luck with today's session, ${name} 💪`,
    `What's up, ${name}?`
  ];
  greetingText = options[Math.floor(Math.random()*options.length)];
}

function renderHeader(){
  const n = nextExam();
  document.querySelector('.greeting').textContent = greetingText;
  const cuteMsgEl = document.querySelector('.cute-msg');
  if(cuteMsgEl) cuteMsgEl.textContent = cuteMsgText;
  document.getElementById('header-sub').textContent = n
    ? `${daysUntil(n)} day${daysUntil(n)===1?'':'s'} to ${fmtDateLabel(n)}`
    : 'Nothing marked yet';
}

function last7DaysSubjectSummary(){
  const totals = {};
  for(let i=0;i<7;i++){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dayData = (state.subjectDayHours && state.subjectDayHours[dateStr]) || {};
    Object.keys(dayData).forEach(subj => {
      totals[subj] = Math.round(((totals[subj]||0) + dayData[subj])*100)/100;
    });
  }
  return totals;
}

async function getStudyAdvice(){
  const btn = document.getElementById('advice-btn');
  if(btn){ btn.textContent = 'Thinking…'; btn.disabled = true; }

  const totals = last7DaysSubjectSummary();
  const subjectList = Object.keys(totals);
  const upcomingExam = nextExam();

  if(subjectList.length === 0){
    state.studyAdvice = "Log a few study sessions in the Tracker first — then I can tell you which subjects need more attention.";
    await saveState();
    render();
    return;
  }

  const summaryText = subjectList.map(s => `${s}: ${totals[s]}h`).join(', ');
  const examText = upcomingExam ? `Next exam is ${fmtDateLabel(upcomingExam)} (${daysUntil(upcomingExam)} days away).` : 'No exam date set yet.';
  const systemText = `You are an AI study advisor for a Matric student. Here is their study time over the last 7 days, per subject: ${summaryText}. ${examText} Give ONE short, specific, actionable insight (max 2 sentences) — point out an imbalance or a subject that's been neglected relative to the others, and suggest what to focus on next. Be direct and concrete, not generic. Reply with ONLY a JSON object, no markdown, in this exact shape: {"advice": "<your insight>"}.`;

  try{
    const result = await callGemini(systemText, "Give me advice.", null);
    state.studyAdvice = result.advice || "Keep logging sessions so I can spot patterns.";
  }catch(e){
    console.error('Study advice failed', e);
    const sorted = subjectList.slice().sort((a,b)=>totals[a]-totals[b]);
    state.studyAdvice = `⚠️ AI unavailable right now — but based on your logged hours, ${sorted[0]} has had the least time (${totals[sorted[0]]}h this week). Might be worth prioritizing.`;
  }
  await saveState();
  render();
}

function renderProgressRing(hours, goalHours, size){
  size = size || 84;
  const radius = size/2 - 9;
  const circumference = 2*Math.PI*radius;
  const pct = Math.max(0, Math.min(hours/goalHours, 1));
  const offset = circumference * (1-pct);
  const cx = size/2, cy = size/2;
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--line)" stroke-width="8"/>
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--priority-yellow)" stroke-width="8"
        stroke-dasharray="${circumference.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round"
        transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset 0.6s ease;"/>
      <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#28374A" font-family="IBM Plex Mono, monospace">${hours}h</text>
    </svg>
  `;
}

function renderHome(){
  const todos = state.todos.filter(t => t.date === todayStr());
  const doneCount = todos.filter(t=>t.done).length;
  const allDone = todos.length > 0 && doneCount === todos.length;
  return `
    <div class="card" style="display:flex;align-items:flex-start;gap:10px;">
      <span style="color:var(--amber);flex:0 0 auto;margin-top:2px;">${icon('quote')}</span>
      <div style="font-size:13px;line-height:1.5;font-style:italic;">${escapeHtml(cuteMsgText)}</div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:14px;">
      <div class="card" style="flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 8px;margin-bottom:0;">
        ${renderProgressRing(hoursToday(), 4, 62)}
        <div class="tag" style="margin-top:6px;">Study hours</div>
      </div>
      <div class="card" onclick="goToTab('calendar')" style="flex:1;cursor:pointer;padding:14px 10px;margin-bottom:0;display:flex;flex-direction:column;justify-content:center;">
        <div class="tag">Next up</div>
        ${nextExam() ? `
          <div style="margin-top:6px;font-size:13px;font-weight:600;line-height:1.3;">${nextEntryLabel()}</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${fmtDateLabel(nextExam())} · ${daysUntil(nextExam())}d</div>
        ` : `<div style="margin-top:6px;font-size:12px;color:var(--ink-soft);">Nothing yet — tap to add</div>`}
      </div>
    </div>
    <div class="card" onclick="goToTab('todo')" style="cursor:pointer;">
      <div class="row">
        <div class="tag">Today's to-dos (${doneCount}/${todos.length})</div>
        ${allDone ? '<span style="font-size:12px;font-weight:700;color:var(--priority-yellow);animation:popIn 0.4s ease;">All done!</span>' : ''}
      </div>
      ${todos.length === 0

function renderCalendar(){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthName = first.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayEntries = (state.calendarEntries && state.calendarEntries[dateStr]) || [];
    const isToday = dateStr === todayStr();
    let topPriority = null;
    if(dayEntries.some(e=>e.priority==='red')) topPriority = 'red';
    else if(dayEntries.some(e=>e.priority==='yellow')) topPriority = 'yellow';
    else if(dayEntries.some(e=>e.priority==='blue')) topPriority = 'blue';
    const fillStyle = topPriority ? `background:${priorityColor(topPriority)};color:white;font-weight:700;` : '';
    cells += `<div class="day ${isToday?'today':''}" style="${fillStyle}" onclick="openDayModal('${dateStr}')">${d}</div>`;
  }

  return `
    <div class="card">
      <div class="tag" style="margin-bottom:10px;">${monthName}</div>
      <div class="calgrid">
        <div class="dow">S</div><div class="dow">M</div><div class="dow">T</div><div class="dow">W</div><div class="dow">T</div><div class="dow">F</div><div class="dow">S</div>
        ${cells}
      </div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:center;">Tap a date to add an exam, test, quiz, or anything else</div>
    ${renderUpcomingList()}
    <div id="day-modal-slot"></div>
  `;
}

async function addCalendarEntry(dateStr){
  const typeVal = document.getElementById('entry-type').value.trim() || 'Note';
  const labelVal = document.getElementById('entry-label').value.trim();
  if(!state.calendarEntries) state.calendarEntries = {};
  if(!state.calendarEntries[dateStr]) state.calendarEntries[dateStr] = [];
  state.calendarEntries[dateStr].push({
    id: 'entry_'+Date.now()+'_'+Math.floor(Math.random()*10000),
    type: typeVal,
    label: labelVal,
    priority: selectedEntryPriority || 'yellow'
  });
  await saveState();
  openDayModal(dateStr);
}

async function deleteCalendarEntry(dateStr, entryId){
  if(state.calendarEntries && state.calendarEntries[dateStr]){
    state.calendarEntries[dateStr] = state.calendarEntries[dateStr].filter(e=>e.id!==entryId);
    if(state.calendarEntries[dateStr].length===0) delete state.calendarEntries[dateStr];
  }
  await saveState();
  openDayModal(dateStr);
}

function renderTodo(){
  const todos = state.todos.filter(t => t.date === todayStr());
  const total = todos.length;
  const doneCount = todos.filter(t=>t.done).length;
  const pct = total === 0 ? 0 : Math.round((doneCount/total)*100);

  let momentumMsg = 'Add your first task for today';
  if(total > 0){
    if(pct === 0) momentumMsg = "Let's begin 💪";
    else if(pct < 50) momentumMsg = 'Good start, keep going';
    else if(pct < 100) momentumMsg = 'Halfway there!';
    else momentumMsg = 'All done for today! 🎉';
  }

  const groups = {};
  todos.forEach(t=>{
    const subj = t.subject || 'General';
    if(!groups[subj]) groups[subj] = [];
    groups[subj].push(t);
  });

  const groupsHtml = Object.keys(groups).map(subj => `
    <div class="card">
      <div class="tag">${escapeHtml(subj)}</div>
      ${groups[subj].map(t => `
        <div class="checkitem">
          <div class="box ${t.done?'done':''}" onclick="toggleTodo('${t.id}')" style="cursor:pointer;"></div>
          ${editingTodoId === t.id ? `
            <input id="edit-input-${t.id}" value="${escapeHtml(t.text)}" onkeydown="if(event.key==='Enter') saveEditTodo('${t.id}')" style="flex:1;padding:4px 8px;border:1px solid var(--amber);border-radius:8px;font-family:'Nunito',sans-serif;font-size:14px;">
            <span onclick="saveEditTodo('${t.id}')" style="color:var(--amber);cursor:pointer;padding:0 6px;font-weight:700;">✓</span>
          ` : `
            <span style="flex:1;cursor:pointer;${t.done?'text-decoration:line-through;color:var(--ink-soft);':''}" onclick="startEditTodo('${t.id}')">${escapeHtml(t.text)}</span>
            <span onclick="startEditTodo('${t.id}')" style="color:var(--ink-soft);padding:0 4px;cursor:pointer;display:flex;">${icon('edit')}</span>
            <span onclick="deleteTodo('${t.id}')" style="color:var(--ink-soft);font-size:16px;padding:0 4px;cursor:pointer;">×</span>
          `}
        </div>`).join('')}
    </div>
  `).join('');

  return `
    <div class="card">
      <div class="tag">Today's progress</div>
      <div style="background:var(--line);border-radius:20px;height:10px;margin-top:8px;overflow:hidden;">
        <div style="background:var(--amber);height:100%;width:${pct}%;transition:width 0.3s;"></div>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">${momentumMsg}</div>
    </div>
    ${total === 0 ? '' : groupsHtml}
    <div class="card">
      <div class="tag">Add a task</div>
      <input id="new-task-subject" placeholder="Subject (e.g. Physics)" onkeydown="if(event.key==='Enter') addTodo()" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:12px;margin-top:8px;font-family:'Nunito',sans-serif;font-size:13px;">
      <input id="new-task-text" placeholder="Task" onkeydown="if(event.key==='Enter') addTodo()" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:12px;margin-top:8px;font-family:'Nunito',sans-serif;font-size:13px;">
      <button class="btn primary" style="width:100%;margin-top:10px;" onclick="addTodo()">Add task</button>
    </div>
  `;
}

async function saveEditTodo(id){
  const input = document.getElementById('edit-input-'+id);
  const val = input ? input.value.trim() : '';
  if(val){
    const t = state.todos.find(t=>t.id===id);
    if(t) t.text = val;
    await saveState();
  }
  editingTodoId = null;
  render();
}

  const t = state.todos.find(t=>t.id===id);
  if(t){ t.done = !t.done; await saveState(); render(); }

async function deleteTodo(id){
  state.todos = state.todos.filter(t=>t.id!==id);

function getLast7DaysHours(){
  const result = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const dateStr = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    result.push({
      label: d.toLocaleDateString('en-US',{weekday:'narrow'}),
      hours: Math.round((state.hoursLog[dateStr]||0)*10)/10,
      isToday: dateStr === todayStr()
    });
  }
  return result;
}

function pixelGrid(matrix, size){
  const cols = matrix[0].length;
  let html = `<div style="display:grid;grid-template-columns:repeat(${cols}, ${size}px);grid-auto-rows:${size}px;">`;
  matrix.forEach(row=>{
    row.forEach(color=>{
      html += `<div style="background:${color||'transparent'};width:${size}px;height:${size}px;"></div>`;
    });
  });
  html += `</div>`;
  return html;
}

function renderTreeSprite(stage, size){
  return pixelGrid(treeStages[Math.min(Math.max(stage,0), treeStages.length-1)], size||8);
}

function renderGrassStrip(units, size){
  let html = '<div style="display:flex;">';
  for(let i=0;i<units;i++){
    html += pixelGrid(i%3===0 ? grassUnitB : grassUnitA, size);
  }
  html += '</div>';
  return html;
}

function renderGrassStripFancy(units, size){
  let html = '<div style="display:flex;">';
  for(let i=0;i<units;i++){
    let unit = i%7===3 ? flowerUnit : (i%3===0 ? grassUnitB : grassUnitA);
    html += pixelGrid(unit, size);
  }
  html += '</div>';
  return html;
}

function escapeJs(str){
  return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

function growthStage(elapsedMs){
  const min = elapsedMs/60000;
  if(min < 5) return 0;
  if(min < 20) return 1;
  if(min < 40) return 2;
  return 3;
}

function formatElapsed(ms){
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

async function stopTimer(){

  const elapsedMs = Date.now()-timerStartMs;
  const hours = elapsedMs/3600000;
  const dateStr = todayStr();
  state.hoursLog[dateStr] = Math.round(((state.hoursLog[dateStr]||0)+hours)*100)/100;

function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function buildPlanSummary(){
  const todos = state.todos.filter(t=>t.date===todayStr() && !t.done);
  if(todos.length === 0) return "You're all caught up for today! 🎉 Tell me if anything changes and I'll adjust your plan.";
  const list = todos.map(t=>`${t.subject}: ${t.text}`).join(', ');
  return `Here's today's plan: ${list}. Let me know if something comes up and I'll adjust it.`;
}

function moveTodosToTomorrow(){
  const today = todayStr();
  const tomorrow = addDays(today, 1);
  const pending = state.todos.filter(t => t.date === today && !t.done);
  pending.forEach(t => { t.date = tomorrow; });
  return pending;
}

function rescheduleToday(){
  const pending = moveTodosToTomorrow();
  if(pending.length === 0){
    return "Looks like everything for today's already done — nothing to move!";
  }
  const list = pending.map(t=>t.text).join(', ');
  return `No worries — I moved ${pending.length} task${pending.length===1?'':'s'} (${list}) to tomorrow. You're still on track.`;
}

function generateReply(text){
  const t = text.toLowerCase();
  if(/(didn.?t study|no time|couldn.?t study|missed|too busy|busy today|out of time)/.test(t)){
    return rescheduleToday();
  }
  if(/(plan|today|schedule)/.test(t)){
    return buildPlanSummary();
  }
  if(/(tired|don.?t want|unmotivated|give up|can.?t do this|exhausted)/.test(t)){
    return "That's okay — even a short 15-minute push counts. Want me to trim today's plan down to just the essentials?";
  }
  return "Got it 👍 Let me know if you want me to move anything around in your plan.";
}

      model,

      userText: userText || "Here's an image.",
      imageBase64: imagePart ? imagePart.base64 : null,
      imageMime: imagePart ? imagePart.mimeType : null
    })
  });
  const data = await response.json();
  const raw = data?.choices?.[0]?.message?.content;
  if(!raw) throw new Error(data?.error?.message || 'No response from AI');

  }catch(parseErr){

async function sendChat(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text && !pendingChatImage) return;
  input.value = '';
  const imageToSend = pendingChatImage;
  pendingChatImage = null;
  state.chatLog.push({
    role:'user',
    text: text || '(sent an image)',
    image: imageToSend ? { base64: imageToSend.base64, mimeType: imageToSend.mimeType } : null
  });
  state.chatLog.push({role:'bot', text:'…', thinking:true});
  render();
  scrollChatBottom();

  const pendingTodos = state.todos.filter(t=>t.date===todayStr() && !t.done);
  let result;
  let debugMsg = null;
  try{
    if(AI_WORKER_URL.startsWith('PASTE_')) throw new Error('AI Worker not set up yet');
    result = await callAI(text, pendingTodos, imageToSend);
  }catch(e){
    console.error('AI call failed, using offline fallback', e);
    debugMsg = (e && e.message) ? e.message : String(e);
    const fallbackReply = imageToSend
      ? "I couldn't reach the AI to look at that image just now (connection issue) — give it a moment and try sending it again."
      : generateReply(text);
    result = { reply: fallbackReply, reschedule: false };
  }

  state.chatLog = state.chatLog.filter(m => !m.thinking);
  if(debugMsg){
    state.chatLog.push({role:'bot', text: '⚠️ debug: '+debugMsg});
  }
  if(result.reschedule){
    if(aiEditEnabled){
      moveTodosToTomorrow();
    } else {
      result.reply += ' (Flip the toggle above if you want me to actually move things — right now I only chatted, nothing changed.)';
    }
  }
  state.chatLog.push({role:'bot', text: result.reply});
  await saveState();
  render();
  scrollChatBottom();
}

  calendar: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  todo: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l2.5 2.5L16 9"/></svg>',
  tracker: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg>',
  chat: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/></svg>',
  settings: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  lightbulb: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 2a7 7 0 00-4 12.7c.5.5.8 1.2.8 1.9v.4h6.4v-.4c0-.7.3-1.4.8-1.9A7 7 0 0012 2z"/></svg>',
  quote: '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7.17 6A5.17 5.17 0 002 11.17V18h6.83v-6.83H5.66c0-1.94 1.57-3.5 3.5-3.5V6H7.17zm9.66 0A5.17 5.17 0 0011.66 11.17V18h6.83v-6.83h-3.17c0-1.94 1.57-3.5 3.5-3.5V6h-1.99z"/></svg>',
  edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>'
};
function icon(name){ return iconSvgs[name] || ''; }

function sidebarLink(tab, iconName, label){
  const active = currentTab === tab;
  return `<button onclick="goToTab('${tab}'); closeSidebar();" style="display:flex;align-items:center;gap:12px;background:${active?'var(--paper)':'none'};border:none;text-align:left;padding:12px 20px;font-size:14px;color:var(--ink);cursor:pointer;font-weight:${active?'700':'400'};width:100%;">
    <span style="display:flex;color:${active?'var(--amber)':'var(--ink-soft)'};">${icon(iconName)}</span>${label}
  </button>`;
}

function openSidebar(){
  document.getElementById('sidebar-slot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeSidebar()" style="justify-content:flex-start;">
      <div style="background:var(--white);width:78%;max-width:280px;height:100%;padding:20px 0;display:flex;flex-direction:column;animation:slideIn 0.25s ease;">
        <div style="padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:8px;">
          <div style="font-weight:700;font-size:16px;">Glade</div>
          <div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">Hi, ${escapeHtml(state.username||'there')}</div>
        </div>
        ${sidebarLink('settings','settings','Settings')}
      </div>
    </div>
  `;
}

function closeSidebar(){
  document.getElementById('sidebar-slot').innerHTML = '';
}

async function saveUsernameFromSettings(){
  const val = document.getElementById('settings-username').value.trim();
  if(!val) return;
  state.username = val;
  pickGreeting();
  await saveState();
  render();
}

function renderSettings(){
  return `
    <div class="card">
      <div class="tag">Your name</div>
      <input id="settings-username" value="${escapeHtml(state.username||'')}" onkeydown="if(event.key==='Enter') saveUsernameFromSettings()" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:12px;margin-top:6px;font-family:'Nunito',sans-serif;font-size:13px;">
      <button class="btn primary" style="width:100%;margin-top:10px;" onclick="saveUsernameFromSettings()">Save name</button>
    </div>
    <div class="card">
      <div class="tag">Tutorial</div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Replay the quick walkthrough of the app's features.</div>
      <button class="btn ghost" style="width:100%;margin-top:10px;" onclick="openTutorial(false)">Replay tutorial</button>
    </div>
    <div class="card">
      <div class="tag">About Glade</div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6;">A study planner built for Matric students — AI-powered planning, a calendar with priorities, and a growing pixel forest to keep you motivated.</div>
    </div>
  `;
}

function goToTab(tab){
  currentTab = tab;
  render();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.dataset.tab;
    render();
  });
});

function showOnboarding(){
  document.querySelector('header').style.display = 'none';
  document.querySelector('.bottom-nav').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div style="min-height:65vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
      <div style="font-size:22px;font-weight:700;margin-bottom:8px;">Welcome 👋</div>
      <div class="tag" style="margin-bottom:18px;">What should we call you?</div>
      <input id="username-input" placeholder="Your name" style="width:80%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;font-family:'Nunito',sans-serif;">
      <button class="btn primary" style="margin-top:16px;width:80%;flex:none;" onclick="submitUsername()">Let's go</button>
    </div>
  `;
  document.getElementById('username-input').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') submitUsername();
  });
}

const tutorialSlides = [
  { icon:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>', title:'Home', text:'A quick glance at your day — today\'s study hours, a preview of your to-dos, and what\'s coming up next.' },
  { icon:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>', title:'Calendar', text:'Tap any date to add exams, tests, or quizzes, and mark how important each one is with a priority color.' },
  { icon:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l2.5 2.5L16 9"/></svg>', title:'To-Do', text:'Add tasks grouped by subject. Check them off and watch the progress bar fill up as you go.' },
  { icon:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg>', title:'Tracker', text:'Start a focus session and the screen goes quiet — just you and a little tree that grows as you study. Every finished session joins your forest.' },
  { icon:'<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H8l-4 4V5a2 2 0 012-2h13a2 2 0 012 2z"/></svg>', title:'AI Planner', text:'Chat about your day — ask for your plan, or tell it if you missed studying. Flip the toggle on if you want it to actually adjust your schedule.' },
];
let tutorialIndex = 0;
let tutorialOpenIsFirstTime = null;

function openTutorial(isFirstTime){
  tutorialOpenIsFirstTime = isFirstTime;
  document.querySelector('.bottom-nav').style.display = 'none';
  renderTutorialSlide(isFirstTime);
}

function renderTutorialSlide(isFirstTime){
  const s = tutorialSlides[tutorialIndex];
  const dots = tutorialSlides.map((_,i)=>`<span style="width:6px;height:6px;border-radius:50%;background:${i===tutorialIndex?'var(--ink)':'var(--line)'};display:inline-block;margin:0 3px;transition:background 0.2s ease;"></span>`).join('');
  const content = document.getElementById('content');
  content.innerHTML = `
    <div id="tutorial-slide" style="min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:0 8px;">
      <div style="color:var(--ink);">${s.icon}</div>
      <div style="font-size:19px;font-weight:700;">${s.title}</div>
      <div style="font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:320px;">${s.text}</div>
      <div style="margin-top:6px;">${dots}</div>
    </div>
    <div style="display:flex;gap:10px;padding:0 4px;">
      ${tutorialIndex > 0 ? '<button class="btn ghost" onclick="prevTutorialSlide('+isFirstTime+')">Back</button>' : `<button class="btn ghost" onclick="finishTutorial(${isFirstTime})">Skip</button>`}
      ${tutorialIndex < tutorialSlides.length-1
        ? `<button class="btn primary" onclick="nextTutorialSlide(${isFirstTime})">Next</button>`
        : `<button class="btn primary" onclick="finishTutorial(${isFirstTime})">Get started</button>`}
    </div>
  `;
  const slideEl = document.getElementById('tutorial-slide');
  if(slideEl){
    slideEl.style.animation = 'none';
    void slideEl.offsetHeight;
    slideEl.style.animation = 'fadeInUp 0.3s ease';
  }
}

function nextTutorialSlide(isFirstTime){
  tutorialIndex = Math.min(tutorialIndex+1, tutorialSlides.length-1);
  renderTutorialSlide(isFirstTime);
}

function prevTutorialSlide(isFirstTime){
  tutorialIndex = Math.max(tutorialIndex-1, 0);
  renderTutorialSlide(isFirstTime);
}

async function finishTutorial(isFirstTime){
  tutorialIndex = 0;
  tutorialOpenIsFirstTime = null;
  document.querySelector('.bottom-nav').style.display = '';
  if(isFirstTime){
    state.tutorialSeen = true;
    await saveState();
  }
  render();
}

async function submitUsername(){
  const val = document.getElementById('username-input').value.trim();
  if(!val) return;
  state.username = val;
  await saveState();
  document.querySelector('header').style.display = '';
  pickGreeting();
  pickCuteMsg();
  if(!state.tutorialSeen){
    tutorialIndex = 0;
    openTutorial(true);
  } else {
    document.querySelector('.bottom-nav').style.display = '';
    render();
  }
}

function hideSplash(){
  const s = document.getElementById('splash');
  if(s){
    s.style.opacity = '0';
    s.style.transform = 'scale(1.08)';
    setTimeout(()=>{ s.remove(); }, 600);
  }
}

async function init(){
  const [_] = await Promise.all([loadState(), new Promise(r=>setTimeout(r,4500))]);
  if(!state.username){
    showOnboarding();
    hideSplash();
    return;
  }
  pickGreeting();
  pickCuteMsg();
  render();
  hideSplash();
}
document.querySelectorAll('.desktop-nav-btn').forEach(btn=>{
  const span = btn.querySelector('.ic');
  if(span) span.innerHTML = icon(btn.dataset.tab);
});

init();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
